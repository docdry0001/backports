name: Build Backports Tar

on:
  # Ձեռքով գործարկում երկու մանիֆեստներով
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Source kernel repository URL'
        required: true
        default: 'https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git'
      source_branch:
        description: 'Source branch/tag'
        required: true
        default: 'v6.6'
      target_repo:
        description: 'Target kernel repository URL'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      target_branch:
        description: 'Target branch/tag'
        required: true
        default: 'android14-6.1-lts'
      # Ընտրովի՝ backports-ի արդյունքի անվանման պրեֆիքս
      output_prefix:
        description: 'Output archive prefix'
        required: false
        default: 'backports'

  # Պահպանում ենք հին release trigger-ը (հետադարձ համատեղելի)
  release:
    types: [published]

jobs:
  build-backports:
    name: Build Backports Tar
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Determine Kernel Parameters
        id: params
        env:
          # workflow_dispatch-ի input-ները
          SRC_REPO: ${{ github.event.inputs.source_repo }}
          SRC_BRANCH: ${{ github.event.inputs.source_branch }}
          TGT_REPO: ${{ github.event.inputs.target_repo }}
          TGT_BRANCH: ${{ github.event.inputs.target_branch }}
          PREFIX: ${{ github.event.inputs.output_prefix }}
          # release-ի դեպքում target-ը վերցնում ենք tag-ից
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            # release trigger – օգտագործում ենք հին տրամաբանությունը (target = linux-stable, source = current)
            KERNEL_TARGET=$(echo $RELEASE_TAG | sed 's/^backports-v//')
            echo "source_repo=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git" >> $GITHUB_OUTPUT
            echo "source_branch=v${KERNEL_TARGET}" >> $GITHUB_OUTPUT
            echo "target_repo=https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git" >> $GITHUB_OUTPUT
            echo "target_branch=v${KERNEL_TARGET}" >> $GITHUB_OUTPUT
            echo "output_prefix=backports-${KERNEL_TARGET}" >> $GITHUB_OUTPUT
          else
            # workflow_dispatch
            echo "source_repo=${SRC_REPO}" >> $GITHUB_OUTPUT
            echo "source_branch=${SRC_BRANCH}" >> $GITHUB_OUTPUT
            echo "target_repo=${TGT_REPO}" >> $GITHUB_OUTPUT
            echo "target_branch=${TGT_BRANCH}" >> $GITHUB_OUTPUT
            echo "output_prefix=${PREFIX:-backports}" >> $GITHUB_OUTPUT
          fi

      - name: Install Dependencies
        run: |
          apk update && apk add git python3 ocaml ocaml-compiler-libs ncurses-dev autoconf automake pkgconfig musl-dev make patch zstd

      - name: Build Coccinelle
        run: |
          git clone --depth=1 https://github.com/coccinelle/coccinelle.git
          cd coccinelle
          ./autogen
          ./configure
          make
          make install

      - name: Checkout backports tool
        uses: actions/checkout@v5

      - name: Clone source kernel
        env:
          REPO: ${{ steps.params.outputs.source_repo }}
          BRANCH: ${{ steps.params.outputs.source_branch }}
        run: |
          git clone --depth=1 --branch ${BRANCH} ${REPO} source-kernel

      - name: Clone target kernel
        env:
          REPO: ${{ steps.params.outputs.target_repo }}
          BRANCH: ${{ steps.params.outputs.target_branch }}
        run: |
          git clone --depth=1 --branch ${BRANCH} ${REPO} target-kernel

      - name: Build Backports (source → target)
        env:
          PREFIX: ${{ steps.params.outputs.output_prefix }}
        run: |
          python3 gentree.py --clean source-kernel ${PREFIX}

      - name: Pack Backports Tar
        env:
          PREFIX: ${{ steps.params.outputs.output_prefix }}
        run: |
          tar -c ${PREFIX} | zstd > ${PREFIX}.tar.zst

      - name: Upload artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.params.outputs.output_prefix }}
          path: ${{ steps.params.outputs.output_prefix }}.tar.zst

      - name: Release upload (if triggered by release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.params.outputs.output_prefix }}.tar.zst
